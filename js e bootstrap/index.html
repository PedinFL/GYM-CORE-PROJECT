
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta a página para celulares -->
    <title>Minha Lista de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Importa o Bootstrap para estilização -->

</head>

<body class="bg-light"> <!-- Inicia o corpo da página com fundo claro -->

    <div class="container mt-5"> <!-- Cria o espaço principal e centraliza o conteúdo -->

        <div class="card p-4 shadow"> <!-- Cria um cartão com espaçamento e sombra -->

            <h2 class="text-center mb-4">Lista de Tarefas</h2> <!-- Exibe o título centralizado -->

            <div class="input-group mb-3"> <!-- Agrupa o campo de texto e o botão -->

                <input type="text" id="campo_tarefa" class="form-control" placeholder="Digite uma tarefa"> <!-- Campo para escrever uma tarefa -->

                <button class="btn btn-primary" onclick="adicionarTarefa()">Adicionar</button> <!-- Executa a função de adicionar tarefa -->

            </div> <!-- Finaliza o grupo de entrada -->

            <ul id="lista_tarefas" class="list-group"> <!-- Cria a lista onde as tarefas serão exibidas -->

            </ul> <!-- Finaliza a lista -->

        </div> <!-- Finaliza o cartão -->

    </div> <!-- Finaliza o espaço principal -->

    <script> // Inicia o código JavaScript

        function adicionarTarefa() { // Cria a função responsável por adicionar tarefas

            let campo = document.getElementById("campo_tarefa"); // Localiza o campo de texto

            let texto = campo.value; // Captura o conteúdo digitado

            if (texto === "") { // Verifica se o campo está vazio
                alert("Digite uma tarefa!"); // Exibe um aviso ao usuário
                return; // Interrompe a função
            } // Finaliza a verificação

            let lista = document.getElementById("lista_tarefas"); // Localiza a lista de tarefas

            let item = document.createElement("li"); // Cria um novo elemento de lista

            item.className = "list-group-item d-flex justify-content-between"; // Define a aparência e organização do item

            item.textContent = texto; // Insere o texto digitado no item

            let botao = document.createElement("button"); // Cria um botão para remover a tarefa

            botao.textContent = "Excluir"; // Define o texto do botão

            botao.className = "btn btn-danger btn-sm"; // Define a aparência do botão

            botao.onclick = function() { // Define a ação executada ao clicar no botão
                item.remove(); // Remove a tarefa da lista
            }; // Finaliza a ação do botão

            item.appendChild(botao); // Adiciona o botão dentro do item

            lista.appendChild(item); // Adiciona o item na lista principal

            campo.value = ""; // Limpa o campo de texto após adicionar

        } // Finaliza a função

    </script> <!-- Finaliza o JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Importa os recursos JavaScript do Bootstrap -->

</body>
</html>
